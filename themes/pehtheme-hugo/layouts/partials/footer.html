<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>DeepSeek 网站页脚</title>
  <!-- 使用简单重置和基础字体，确保一致性 -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f7f9fc;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* 模拟页面主要内容，让footer自然贴在底部 */
    .main-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      color: #2c3e50;
      font-size: 1.2rem;
      text-align: center;
    }

    /* ----- footer 核心样式 (移动优先, 完全响应式) ----- */
    .site-footer {
      background-color: #ffffff;
      border-top: 1px solid #eaeef3;
      padding: 1.5rem 1.5rem 1.2rem;
      box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.02);
      transition: padding 0.2s ease;
    }

    .footer-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    /* 第一行：协议 + 政策 (链接) */
    .footer-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 0.75rem 1.2rem;
      font-size: 0.95rem;
    }

    .footer-links a {
      color: #1a2634;
      text-decoration: none;
      font-weight: 500;
      padding: 0.2rem 0;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s, color 0.2s;
      white-space: nowrap;
    }

    .footer-links a:hover {
      color: #0066cc;
      border-bottom-color: #0066cc;
    }

    /* 分隔符 (用伪元素实现, 更灵活) */
    .footer-links .divider {
      color: #b0c0ce;
      font-weight: 300;
      user-select: none;
    }

    /* 第二行：备案 + 联系 (并排) */
    .footer-meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 0.5rem 1.5rem;
      font-size: 0.85rem;
      color: #4a5a6a;
    }

    .footer-meta .icp {
      color: #4a5a6a;
      letter-spacing: 0.3px;
    }

    .footer-meta .contact-link {
      color: #1a2634;
      text-decoration: none;
      font-weight: 450;
      transition: color 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .footer-meta .contact-link:hover {
      color: #0066cc;
    }

    /* 小屏优化 (手机) */
    @media (max-width: 480px) {
      .site-footer {
        padding: 1.2rem 1rem 1rem;
      }

      .footer-links {
        font-size: 0.9rem;
        gap: 0.4rem 0.8rem;
      }

      .footer-links a {
        white-space: normal; /* 允许折行, 更灵活 */
      }

      .footer-meta {
        font-size: 0.75rem;
        gap: 0.4rem 0.8rem;
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
      }

      /* 去掉分隔符, 用间距和换行自然分开 */
      .footer-links .divider {
        display: none;  /* 移动端隐藏分隔符, 用间距代替 */
      }

      /* 针对移动端, 重新用伪元素做分隔符? 但我们用更简洁的方式: 加个竖线伪元素? 其实隐藏更干净 */
      /* 但为了视觉清晰, 我们保留少量分隔符, 但调整 */
    }

    /* 对于极窄屏, 让所有链接堆叠更整齐 */
    @media (max-width: 380px) {
      .footer-links {
        flex-direction: column;
        gap: 0.3rem;
      }
      .footer-meta {
        flex-direction: column;
        gap: 0.3rem;
      }
      .footer-links .divider {
        display: none; /* 完全隐藏分隔符 */
      }
    }

    /* 大屏舒适间距 */
    @media (min-width: 768px) {
      .site-footer {
        padding: 2rem 3rem 1.8rem;
      }
      .footer-container {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
      }
      .footer-links {
        font-size: 1rem;
        gap: 0.8rem 1.8rem;
      }
      .footer-meta {
        font-size: 0.9rem;
        gap: 0.8rem 1.8rem;
      }
    }

    @media (min-width: 1024px) {
      .footer-links {
        gap: 1rem 2.2rem;
      }
    }

    /* 辅助分隔符小圆点或者竖线 — 使用更现代的分隔方式 */
    .footer-links .divider {
      color: #c0cedc;
      font-size: 0.7rem;
      display: inline-block;
    }

    /* 针对移动端显示分隔符的优化 */
    @media (max-width: 480px) {
      .footer-links .divider {
        display: inline-block; /* 重新显示, 但保持细小 */
        font-size: 0.6rem;
        color: #d0dce8;
      }
    }

    /* 增加一个简单的 '·' 分隔, 但保留版权符号等 */
    .footer-meta .dot-sep {
      color: #b8c8d8;
      font-size: 0.5rem;
      margin: 0 0.1rem;
    }

    /* 让联系邮箱更明显 */
    .contact-email {
      background: #f0f4fa;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-size: 0.8rem;
      color: #1a2a3a;
      transition: background 0.2s;
    }
    .contact-email:hover {
      background: #e3eaf2;
    }

    /* 页面整体简单样式 */
    .main-content h2 {
      font-weight: 400;
      color: #2c3e50;
    }
    .main-content span {
      background: #eef2f7;
      padding: 0.2rem 0.8rem;
      border-radius: 30px;
      font-size: 0.9rem;
      color: #0066cc;
    }
  </style>
</head>
<body>
  <!-- 模拟页面主要内容区 -->
  <div class="main-content">
    <div>
      <h2>✨ DeepSeek 对话界面</h2>
      <p style="margin-top: 0.8rem; color: #4a5a6a; font-size: 0.95rem;">
        <span>🚀 智能 · 高效 · 开放</span>
      </p>
    </div>
  </div>

  <!-- ========== 页脚区域 (完全根据 deepseek.com 底部信息构建) ========== -->
  <footer class="site-footer">
    <div class="footer-container">

      <!-- 第一行：用户协议 & 隐私政策 (来自页面) -->
      <div class="footer-links">
        <a href="#" aria-label="用户协议">用户协议</a>
        <span class="divider">·</span>
        <a href="#" aria-label="隐私政策">隐私政策</a>
        <!-- 页面中还有 "忘记密码" 和 "登录注册" 等, 但那是登录模块, 不属于footer, 所以不放入 -->
        <!-- 但为保留品牌元素, 我们保持简洁: 只放协议和政策 -->
        <!-- 同时可以加一个 '联系我们' 但下面meta有, 这里不重复 -->
      </div>

      <!-- 第二行：备案 + 联系我们 + 版权/品牌信息 (浙ICP备 + 联系我们) -->
      <div class="footer-meta">
        <span class="icp">浙ICP备2023025841号</span>
        <span class="dot-sep">·</span>
        <a href="mailto:support@deepseek.com" class="contact-link" aria-label="联系我们">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 2px;">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
          </svg>
          联系我们
        </a>
        <!-- 也可以放一个版权符号, 但页面没有明确, 保留干净 -->
      </div>

      <!-- 注意: 页面底部还有 'One more step before you proceed...' 但那是验证提示, 不属于footer固定内容, 忽略 -->
    </div>
  </footer>
</body>
</html>
